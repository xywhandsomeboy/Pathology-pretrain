MODEL:
  WEIGHTS: ''
compute_precision:
  grad_scaler: true
  student:
    backbone:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp16
        buffer_dtype: fp32
    dino_head:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp32
        buffer_dtype: fp32
    ibot_head:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp32
        buffer_dtype: fp32
    node_fusion:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp32
        reduce_dtype: fp32
        buffer_dtype: fp32
    gcn:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp32
        reduce_dtype: fp32
        buffer_dtype: fp32
    spatial_agg:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp32
        reduce_dtype: fp32
        buffer_dtype: fp32
    mask_token:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp32
        reduce_dtype: fp32
        buffer_dtype: fp32
    node_decoder:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp32
        reduce_dtype: fp32
        buffer_dtype: fp32
    projection:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp32
        reduce_dtype: fp32
        buffer_dtype: fp32
    edge_existence_head:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp32
        reduce_dtype: fp32
        buffer_dtype: fp32
    edge_type_head:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp32
        reduce_dtype: fp32
        buffer_dtype: fp32
    edge_weight_head:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp32
        reduce_dtype: fp32
        buffer_dtype: fp32
dino:
  loss_weight: 1.0
  head_n_prototypes: 65536
  head_bottleneck_dim: 256
  head_nlayers: 3
  head_hidden_dim: 2048
  koleo_loss_weight: 0.1
ibot:
  loss_weight: 1.0
  mask_sample_probability: 0.5
  mask_ratio_min_max:
  - 0.1
  - 0.5
  separate_head: false
  head_n_prototypes: 65536
  head_bottleneck_dim: 256
  head_nlayers: 3
  head_hidden_dim: 2048
train:
  # One dataloader sample is one WSI graph; its image patches are GNN nodes.
  batch_size_per_gpu: 1
  dataset_path: ImageNet:split=TRAIN
  output_dir: .
  saveckp_freq: 20
  seed: 0
  num_workers: 10
  OFFICIAL_EPOCH_LENGTH: 100
  cache_dataset: true
  centering: "centering" # or "sinkhorn_knopp"
student:
  arch: vit_large
  patch_size: 16
  drop_path_rate: 0.3
  layerscale: 1.0e-05
  drop_path_uniform: true
  pretrained_weights: ''
  ffn_layer: "mlp"
  block_chunks: 0
  qkv_bias: true
  proj_bias: true
  ffn_bias: true
  num_register_tokens: 0
  interpolate_antialias: false
  interpolate_offset: 0.1
  momentum: 0.992
  final_momentum: 1
gcn:
  num_layer: 5
  # The fused node representation remains 1024-D, matching DINOv2 ViT-L.
  emb_dim: 1024
  JK: "last"
  dropout_ratio: 0
  gnn_type: "gat"
  # Raw DINO patch tokens -> 2-D depthwise conv -> global + alpha * spatial.
  spatial_agg_hidden: 256
  spatial_fusion_alpha: 0.1
  # 修改3.2：初始空间图仅根据 WSI 坐标构建（邻接半径）
  spatial_radius: 50.0
  # 修改3出口：context-aware 相似度发现语义边的阈值与上限（0=仅Spatial,1=仅Semantic,2=Spatial+Semantic）
  semantic_sim_threshold: 0.7
  semantic_max_edges: 4096
  # Graph-MAE: random node, contiguous spatial region, and random-walk masks.
  node_mask_ratio: 0.3
  node_recon_weight: 1.0
  node_recon_mse_weight: 1.0
  node_recon_cos_weight: 1.0
  # Edge existence -> relation type, with edge attributes as an auxiliary target.
  edge_mask_ratio: 0.3
  num_neg_pairs: 128
  negatives_per_positive: 2
  edge_existence_weight: 1.0
  edge_relation_weight: 0.5
  edge_weight_weight: 0.1
  # A negative must be far and dissimilar in both visual and contextual spaces.
  reliable_neg_distance_ratio: 2.0
  reliable_neg_visual_sim_max: 0.2
  reliable_neg_context_sim_max: 0.2
  # Context contrastive views use weak noise and preserve graph topology.
  contrast_weight: 1.0
  contrast_temperature: 0.5
  contrast_proj_dim: 128
  contrast_alignment_weight: 0.1
  feature_noise_std: 0.05
  edge_weight_noise_std: 0.02
  contrast_feature_mask_ratio: 0.05
  view_edge_drop: 0.01
  # DINO 原始结果保存容器（落盘 .pt，含 CLS/patch head 输出、空间聚合特征、坐标等）
  save_dino_features: false
  dino_feature_dir: "dino_raw_features"
  dino_feature_save_every: 1
  dino_feature_max_files: 0  # 0 = 不限制，>0 时超出则删最早的文件
optim:
  epochs: 100
  weight_decay: 0.04
  weight_decay_end: 0.4
  base_lr: 0.004  # learning rate for a batch size of 1024
  lr: 0.  # will be set after applying scaling rule
  warmup_epochs: 10
  min_lr: 1.0e-06
  clip_grad: 3.0
  freeze_last_layer_epochs: 1
  scaling_rule: sqrt_wrt_1024
  patch_embed_lr_mult: 0.2
  layerwise_decay: 0.9
  adamw_beta1: 0.9
  adamw_beta2: 0.999
crops:
  global_crops_scale:
  - 0.32
  - 1.0
  local_crops_number: 8
  local_crops_scale:
  - 0.05
  - 0.32
  global_crops_size: 224
  local_crops_size: 96
evaluation:
  eval_period_iterations: 12500
