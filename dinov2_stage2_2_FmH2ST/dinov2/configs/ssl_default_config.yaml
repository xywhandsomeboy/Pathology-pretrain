MODEL:
  WEIGHTS: ''
compute_precision:
  grad_scaler: true
  student:
    gcn:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp32
        reduce_dtype: fp32
        buffer_dtype: fp32
    mask_token:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp32
        reduce_dtype: fp32
        buffer_dtype: fp32
    node_decoder:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp32
        reduce_dtype: fp32
        buffer_dtype: fp32
    projection:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp32
        reduce_dtype: fp32
        buffer_dtype: fp32
    edge_existence_head:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp32
        reduce_dtype: fp32
        buffer_dtype: fp32
    edge_weight_head:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp32
        reduce_dtype: fp32
        buffer_dtype: fp32
train:
  # One sample is one complete WSI graph.
  batch_size_per_gpu: 1
  dataset_path: ImageNet:split=TRAIN
  output_dir: .
  saveckp_freq: 20
  seed: 0
  num_workers: 10
  OFFICIAL_EPOCH_LENGTH: 122 #1938
  cache_dataset: true
  centering: "centering" # or "sinkhorn_knopp"
student:
  momentum: 0.992
  final_momentum: 1
gcn:
  arch: 'gnn'
  pretrained_weights: ''
  num_layer: 5
  emb_dim: 1024
  JK: "sum"
  # [spatial_weight, semantic_weight], kept separate for the GNN.
  edge_dim: 2
  # Baseline injects encoded edge features into both attention and messages.
  # Stage-2 experiment configs may select "attention_bias" with edge_dim=1.
  edge_injection: "message_and_attention"
  spatial_bias_init: 0.0
  dropout_ratio: 0
  # Dynamic attention; legacy "gat" remains available for old experiments.
  gnn_type: "gatv2"
  block_chunks: 1
  use_residual: true
  use_layernorm: true
  # Exact-ratio random, spatial-region and random-walk Graph-MAE masks are all
  # optimized together; there is no second dataset-side mask strategy.
  node_mask_ratio: 0.3
  node_recon_weight: 1.0
  node_recon_mse_weight: 1.0
  node_recon_cos_weight: 1.0
  # Edge existence uses masked positives and reliable non-edge negatives.
  edge_mask_ratio: 0.3
  negatives_per_positive: 2
  edge_existence_weight: 1.0
  edge_weight_weight: 0.1
  reliable_neg_distance_ratio: 2.0
  reliable_neg_visual_sim_max: 0.2
  reliable_neg_context_sim_max: 0.2
  # Contrastive views use moderate pairwise DropEdge while retaining at least
  # two spatial neighbours per node whenever the original graph has them.
  contrast_weight: 1.0
  contrast_temperature: 0.5
  contrast_proj_dim: 128
  contrast_alignment_weight: 0.1
  feature_noise_std: 0.05
  edge_weight_noise_std: 0.02
  contrast_feature_mask_ratio: 0.05
  view_edge_drop: 0.05
  contrast_min_neighbors: 2
optim:
  epochs: 400
  weight_decay: 0.04
  weight_decay_end: 0.4
  base_lr: 0.004  # learning rate for a batch size of 1024
  lr: 0.  # will be set after applying scaling rule
  warmup_epochs: 10
  min_lr: 1.0e-06
  clip_grad: 3.0
  freeze_last_layer_epochs: 1
  scaling_rule: sqrt_wrt_1024
  patch_embed_lr_mult: 0.2
  layerwise_decay: 0.9
  adamw_beta1: 0.9
  adamw_beta2: 0.999
evaluation:
  eval_period_iterations: 122 #1938
